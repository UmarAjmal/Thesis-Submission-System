<form action="{{ url_for('routes.update_personal_info') }}" method="POST">
    {{ form.hidden_tag() }} <!-- This adds the CSRF token -->
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ current_user.name }}" required>
    </div>
    <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" id="address" name="address" value="{{ current_user.address }}" required>
    </div>
    <div class="mb-3">
        <label for="phone_no" class="form-label">Phone Number</label>
        <input type="text" class="form-control" id="phone_no" name="phone_no" value="{{ current_user.phone_no }}" required>
    </div>
    <div class="mb-3">
        <label for="university_name" class="form-label">University Name</label>
        <input type="text" class="form-control" id="university_name" name="university_name" value="{{ current_user.university_name }}" required>
    </div>
    <div class="mb-3">
        <label for="blood_group" class="form-label">Blood Group</label>
        <input type="text" class="form-control" id="blood_group" name="blood_group" value="{{ current_user.blood_group }}" required>
    </div> 
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
